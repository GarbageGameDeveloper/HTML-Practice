<!DOCTYPE html>
<html>
	<head>

		
		<!-- STYLES -->
		<style>
			body
			{
				background-color: #000000;
				color: #FFFFFF; 
				font-size: 18px;
				font-familty: Arial, Helvetica, sans-serif;

				max-width: 600px;
				margin: auto;
			}
			
			div {}

			/* PHOTO GRID */
			div .centered_image_grid 
			{
				display: grid;
				grid-template-columns: 1fr 1fr 1fr;
			}
			div .centered_image_grid .image
			{
				padding:5px;
			}

			/* CENTERED TEXT */
			.header_box
			{
				justify-content: center;	/* Horizontally alligned */
				align-items: center;		/* Vertically alligned */

				font-size: 6px;
			}
			.header_box h1 
			{
				padding-top: 60px;
				padding-bottom: 0px;
				margin: 0px;

				color: #FF0000; 
			    font-size: 60px;
			    text-align: center;
			}
			.header_box h2 
			{
				padding-top: 0px;
				padding-bottom: 0px;
				margin: 0px;
				
			    font-size: 40px;
			    text-align: center;
			}
			
		</style>
	</head>



	
	
	<body>
		<div class="header_box">
			<h1><u>MISSING PERSON</u></h1>
			<h2>BRAYDEN MAURIELLO</h2>
		</div>
		
		<div>
			<div class="centered_image_grid">
				<div class=".image"><img src="images/Image 4.jpg" width="195" height="195"></div>
				<div class=".image"><img src="images/Image 1.jpg" width="195" height="195"></div>	
				<div class=".image"><img src="images/Image 2.jpg" width="195" height="195"></div>
				<div class=".image"><img src="images/Image 3.jpg" width="195" height="195"></div>
				<div class=".image"><img src="images/Image 6.jpg" width="195" height="195"></div>
				<div class=".image"><img src="images/Image 5.jpg" width="195" height="195"></div>
			</div>

			<p>
				So many words, not enough time.
			</p>

			<br><a href="https://www.moma.org/">Hyperlink Text </a><br>
			<ul>
				<li>Words for list element???</li>
			</ul>
			
			<br>A ton of words
		</div>
		
	</body>


	
</html>
