<!DOCTYPE html>
<html>
	<head>

		
		<!-- STYLES -->
		<style>
			body
			{
				background-color: #000000;
				
				background-image: url("images/BackgroundRepeat.jpg");
				background-repeat: repeat;
				
				color: #FFFFFF; 
				font-size: 24px;
				font-familty: Arial, Helvetica, sans-serif;

				max-width: 600px;
				margin: auto;
			}

			/* PHOTO GRID */
			div .centered_image_grid 
			{
				display: grid;
				grid-template-columns: 1fr 1fr;
			}
			div .centered_image_grid .image
			{
				padding:10px;
			}

			/* CENTERED TEXT */
			.sub_div 
			{
				position: relative;
				top: 320px;
				background-color: #000000;
			}
			.sub_div .centered_text
			{	
				justify-content: center;	/* Horizontally alligned */
				align-items: center;		/* Vertically alligned */
				text-align: center;

				font-size: 24px;
			}
			.sub_div .centered_text h1 
			{
				padding-top: 24px;
				padding-bottom: 0px;
				margin: 0px;

				color: #FF0000;
			    font-size: 60px;
			}
			.sub_div .centered_text h2 
			{
				padding-top: 0px;
				padding-bottom: 24px;
				margin: 0px;
				
				font-size: 44px;
			}

			/* GIFS */
			.left_gif 
			{
				position: fixed;
				top: 50%; left: 50%;	/* centers the box */
				transform: translate(-1200px,-450px);
				width: 1200px; height: 1000px;
				margin: 0;
			}
			.right_gif 
			{
				position: fixed;
				top: 50%; left: 50%;	/* centers the box */
				transform: translate(0,-450px);
				width: 1200px; height: 1000px;
				margin: 0;
			}

			.hidden_text
			{
				position: fixed;
				bottom: 100px; right: 200px;

				font-size: 12px;
			}
			
		</style>
	</head>
